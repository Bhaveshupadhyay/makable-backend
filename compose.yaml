# Production on a Hostinger VPS next to CloudPanel: CloudPanel's Nginx handles SSL and reverse-proxies
# traffic to the API on http://127.0.0.1:8787. The API is only published on the loopback interface (127.0.0.1),
# so it is never exposed directly to the public internet and doesn't conflict with host ports 80/443.
#
# CI/CD (.github/workflows/ci-cd.yml) deploys main when asked ([deploy] in a commit message, or a manual run): it
# copies this file to the server, pulls the image it built (API_IMAGE, tagged with the commit), runs the migrations
# and restarts. By hand on the server:
#
#   docker compose pull && docker compose up -d       # the latest image from main
#   API_IMAGE=ghcr.io/bhaveshupadhyay/makable-backend:<commit sha> docker compose up -d   # roll back to a commit
#   docker compose logs -f api
#
# `docker compose up --build` builds from source instead (needs a clone of the repo).
#
# The app's settings are in .env. Compose expands `$` in .env values, so write a literal `$` (e.g. in DB_PASSWORD) as `$$`.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  api:
    build: .
    image: ${API_IMAGE:-ghcr.io/bhaveshupadhyay/makable-backend:latest}
    env_file: .env
    environment:
      ENVIRONMENT: production
    ports:
      - "127.0.0.1:8787:8787"
    deploy:
      resources:
        reservations:
          memory: 16G
        limits:
          memory: 24G
    restart: unless-stopped
    logging: *logging
